- name: Konfiguracja serwera
  hosts: web
  become: true

  tasks:
    - name: Aktualizacja listy pakietow
      apt:
        update_cache: yes

    - name: Instalacja nginx i ufw
      apt:
        name:
          - nginx
          - ufw
        state: present

    - name: Zezwol na SSH w firewallu
      ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Zezwol na HTTP w firewallu
      ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Wlacz firewall
      ufw:
        state: enabled

    - name: Upewnij sie ze nginx dziala
      service:
        name: nginx
        state: started
        enabled: true
